    <!-- The build writes each route's title, description, canonical, social tags
         and structured data in place of the block below. The dev server serves
         this shell as it stands, and the page restates its own title once it runs. -->
    <!--route-head-->
    <title>Delux Financial Solutions | Credit Education in Houston, TX</title>

    <script>
      // Runs before the first paint, so a stored choice never arrives as a flash of
      // the wrong theme. The document is the one source of the resolved value:
      // everything after this reads data-theme rather than storage.
      //
      // Light is the default rather than the system preference: white pages framed
      // by navy bands. System is one of the four choices in the footer picker for
      // anyone who wants it.
      (function () {
        var root = document.documentElement;
        var stored = null;
        try {
          stored = localStorage.getItem('delux-theme');
        } catch (ignored) {}
        var dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.setAttribute('data-theme-choice', stored || 'light');
        root.setAttribute(
          'data-theme',
          !stored ? 'light' : stored === 'system' ? (dark ? 'dark' : 'light') : stored,
        );
        try {
          if (localStorage.getItem('delux-lang') === 'es') root.lang = 'es';
        } catch (ignored) {}
      })();
    </script>

            send(
              JSON.stringify({
                site: site,
                kind: kind,
                message: String(message || 'Unknown error').slice(0, 1500),

        // event the first failure fires reaches this handler on the way down to

        // rather than an empty frame, and the reader whose retry then arrives

        // empty, so an image is read again once the retry has had its chance
        // and only one that still has not decoded is filed. A file that is
        // genuinely gone fails both attempts and reports exactly as before.
        var RETRY_MS = 1200;

        // commonest shape of a bad connection fires none: a request the
        // network accepts and never answers. Nothing then hears that the
        // first attempt is lost, so no second one is made, the address
        // underneath is never asked for, and the frame stays empty for as
        // long as the browser is willing to wait on the socket - tens of
        // seconds on a dropped mobile connection and the rest of the visit on
        // a half-open one. So an attempt is given a deadline as well as a
        // handler, and a deadline that passes with the frame still empty is a
        // failed attempt: the next address is asked for straight away rather
        // than after the pause a lost request gets, because this one has
        // already waited. The mark is 11.8 KB, so a window this wide is a
        // connection that was not going to deliver it.
        var ATTEMPT_MS = 3000;
        // Asking again has to be possible before the app is running. The mark in
        // the header is the first image request of every visit - eager, highest
        // priority, issued while the document is still being parsed - and the
        // handler that asked for it again was attached by the app during
        // hydration, which on a phone is seconds of bundle download and parse
        // later. A request lost in that gap reached nothing: no second attempt
        // was ever made, the frame stayed empty for the rest of the visit, and
        // the reader's report described exactly what they were looking at. This
        // script is installed before the first byte of the body, so the ask
        // lives here and the app calls into it rather than carrying its own.
        //
        // The second request carries a parameter the first did not, because a
        // failed fetch leaves a broken entry for that address in the browser's
        // memory cache and a fresh request for the identical URL is answered out
        // of it without touching the network. A <picture> chooses the address
        // rather than the <img>, so the candidates on its <source> elements move
        // too; static hosting ignores the parameter, and the reporter strips a
        // query string before it fingerprints, so a genuine second failure files
        // under the same fingerprint as the first.
        var state = new WeakMap();
        function reachedBy(target) {
          var reached = state.get(target);
          if (!reached) {
            reached = { made: 0, flight: false, deadline: 0 };
            state.set(target, reached);

          return reached;
        }
        // An attempt that has not filled the frame by its deadline is a failed
        // attempt, and it is answered exactly as a failed one is.
        function watchAttempt(target) {
          var reached = reachedBy(target);
          if (reached.deadline) clearTimeout(reached.deadline);
          reached.deadline = setTimeout(function () {
            reached.deadline = 0;
            if (target.complete && target.naturalWidth > 0) return;
            if (target.isConnected === false) return;
            askAgain(target, true);
          }, ATTEMPT_MS);

        // The attempt answered for itself, so its deadline is spent.
        function settled(target) {
          var reached = state.get(target);
          if (reached && reached.deadline) {
            clearTimeout(reached.deadline);

        function owed(target) {
          var reached = state.get(target);
          return !!reached && (reached.flight === true || reached.deadline !== 0);
        }
        function freshen(address) {
          var url = String(address || '').trim();
          if (!url || url.slice(0, 5) === 'data:') return address;
          return url + (url.indexOf('?') > -1 ? '&' : '?') + 'retry=1';
        }
        function freshenCandidates(value) {
          return String(value)
            .split(',')
            .map(function (candidate) {
              var parts = candidate.trim().split(/\s+/);
              if (!parts[0]) return candidate;
              parts[0] = freshen(parts[0]);
              return parts.join(' ');

            .join(', ');
        }
        // An element in a <picture> has a second address it has never tried:
        // its own `src`. A <picture> resolves once - the browser picks a
        // candidate off a <source>, and an <img> whose chosen candidate fails
        // is left empty for the rest of the visit. It never reaches the png
        // underneath it, however well that file answers. So the mark's fallback
        // was unreachable in the one case it exists for, and anything that cost
        // this client the webp cost it the mark: a request lost on a connection
        // that has not warmed, a body truncated in the middle, a decode that
        // fails on arrival. The <source> is taken out of the choice rather than
        // out of the document, because the app owns those nodes and removing
        // one from under it breaks its next update. An empty candidate list is
        // no candidates, so the browser moves on to the <img>.

          function bare(address) {
            return String(address || '')
              .split('?')[0]
              .split('#')[0]
              .replace(/^[a-z]+:\/\/[^/]+/i, '');

          var left = bare(one);
          return left !== '' && left === bare(other);

          var picture = target.parentElement;
          if (!picture || !picture.tagName || picture.tagName.toLowerCase() !== 'picture')

          if (!picture.querySelector('source')) return '';
          var own = target.getAttribute('src');
          if (!own) return '';

          // <source> elements offers nothing it has not already tried.
          if (sameFile(target.currentSrc, own)) return '';

          // ever requesting it. The fallback has never been on the wire, so
          // there is no failed entry of it to ask past and it goes as written.
          return requested(own);
        }
        function stopOffering(target) {
          var picture = target.parentElement;
          if (!picture) return;
          var sources = picture.querySelectorAll('source');
          for (var i = 0; i < sources.length; i += 1) sources[i].setAttribute('srcset', '');

        // gone cannot put the page in a loop asking for it, and they are not the
        // same ask twice: the first is the same addresses again, for a request
        // that was simply lost, and the second is the address the element has
        // not tried. True while an ask is still owed or in flight, which is what
        // tells a caller whether this image has anything left to wait for: the
        // same failure reaches this handler and the element's own, and both are
        // answered the same.

          if (!target) return false;
          var reached = reachedBy(target);
          if (reached.flight) return true;
          var fallback = reached.made === 1 ? fallbackAddress(target) : '';

          reached.flight = true;
          var again = reached.made === 1;
          setTimeout(
            function () {
              reached.flight = false;
              if (!again) stopOffering(target);
              var picture = target.parentElement;
              if (
                again &&
                picture &&
                picture.tagName &&
                picture.tagName.toLowerCase() === 'picture'

                var sources = picture.querySelectorAll('source');

              var src = again ? target.getAttribute('src') : fallback;

              // document and would fetch the page itself. Clearing both re-runs
              // the picture element's own selection rather than pinning one
              // candidate of it.
              target.removeAttribute('srcset');
              target.removeAttribute('src');

                // entry of it in the browser's cache to ask past.

        // deadline, because it has an address underneath the one the browser

        // not been requested yet, so a deadline on either would cancel a

            function (whole, lead, tail) {

                  'resource',

              'rejection',

              reason && reason.stack,

            if (!loud) event.preventDefault();

              function (error) {

                // an extension issued through this page's own fetch, and the
                // handler that reads it is given nothing to read without it.
                report(
                  'network',
                  (error && error.message ? error.message : String(error)) +
                    ' fetching ' +
                    target.split('?')[0],
                  error && error.stack,
                );
                throw error;
              },
            );
          };
        }
      })();
