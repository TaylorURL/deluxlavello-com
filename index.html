<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The build writes each route's title, description, canonical, social tags
         and structured data in place of the block below. The dev server serves
         this shell as it stands, and the page restates its own title once it runs. -->
    <!--route-head-->
    <title>Delux Financial Solutions | Credit Education in Houston, TX</title>
    <!--/route-head-->
    <meta property="og:site_name" content="Delux Financial Solutions" />
    <meta property="og:image" content="https://deluxlavello.com/og-card.png" />
    <script>
      // Runs before the first paint, so a stored choice never arrives as a flash of
      // the wrong theme. The document is the one source of the resolved value:
      // everything after this reads data-theme rather than storage.
      //
      // Dark is the default rather than the system preference, because the brand is
      // a gold mark on a near-black ground. System is one of the four choices in the
      // footer picker for anyone who wants it.
      (function () {
        var root = document.documentElement;
        var stored = null;
        try {
          stored = localStorage.getItem('delux-theme');
        } catch (ignored) {}
        var dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.setAttribute('data-theme-choice', stored || 'dark');
        root.setAttribute(
          'data-theme',
          !stored ? 'dark' : stored === 'system' ? (dark ? 'dark' : 'light') : stored,
        );
        try {
          if (localStorage.getItem('delux-lang') === 'es') root.lang = 'es';
        } catch (ignored) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The dark ground the site opens on, filled from the token at build time. The
         script rewrites it to whatever the chosen theme actually paints, so this is
         what the browser chrome takes before the module runs and on a visit that
         never runs it. -->
    <meta name="theme-color" content="<!--themecolor-->" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://deluxlavello.com/og-card.png" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/brand/logo-mark-148.webp"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://sunday.tail1f78d7.ts.net" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/source-sans-3-latin-variable.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/source-serif-4-latin-variable.woff2"
      crossorigin
    />
    <script>
      (function () {
        var endpoint = 'https://sunday.tail1f78d7.ts.net/report';
        var site = 'Delux Financial Solutions';
        var sent = 0;
        // Nothing the page can intercept reaches the visitor's console. Each error
        // is reported first and swallowed second, so the report is made whether or
        // not the suppression holds. What survives is written by the browser's own
        // network layer, which no page script can reach.
        var loud = false;
        var held = [];
        try {
          if (location.search.indexOf('console=on') > -1)
            localStorage.setItem('reporter-console', '1');
          if (location.search.indexOf('console=off') > -1)
            localStorage.removeItem('reporter-console');
          loud = localStorage.getItem('reporter-console') === '1';
        } catch (ignored) {}
        // An extension injects its scripts into the page, so a rejection thrown
        // inside one arrives at this handler with nothing of the site in its stack.
        // A stack naming only extension scripts describes the visitor's browser;
        // one carrying a single site frame is the site's.
        function extensionOnly(stack) {
          var schemes = String(stack || '').match(/[a-z][a-z0-9+.-]*:\/\//gi);
          if (!schemes) return false;
          for (var i = 0; i < schemes.length; i += 1) {
            var scheme = schemes[i].slice(0, -3).toLowerCase();
            if (scheme.slice(-9) !== 'extension') return false;
          }
          return true;
        }
        // A request the page makes writes its own failure to the console when it
        // fails, and a collector that cannot be reached would then be the loudest
        // thing on the page. The same request issued inside a worker writes
        // nothing, so reports travel that way while the page is alive.
        var unloading = false;
        var worker = null;
        var workerFailed = false;
        function transport() {
          if (worker || workerFailed) return worker;
          try {
            var source =
              "self.onmessage=function(e){fetch(e.data.endpoint,{method:'POST',body:e.data.body}).then(function(){},function(){})}";
            worker = new Worker(
              URL.createObjectURL(new Blob([source], { type: 'text/javascript' })),
            );
          } catch (ignored) {
            workerFailed = true;
          }
          return worker;
        }
        function send(body) {
          // On the way out the worker dies with the page, and the console goes with
          // it, so the beacon's survival is worth more than its silence.
          if (!unloading) {
            var channel = transport();
            if (channel) {
              channel.postMessage({ endpoint: endpoint, body: body });
              return;
            }
          }
          if (navigator.sendBeacon) {
            navigator.sendBeacon(endpoint, body);
          } else {
            fetch(endpoint, { method: 'POST', body: body, keepalive: true }).catch(function () {});
          }
        }
        addEventListener('pagehide', function () {
          unloading = true;
        });
        // Everything swallowed stays readable on the page itself, so a live console
        // with the flag off still answers what happened.
        function hold(kind, message, stack) {
          if (held.length < 50)
            held.push({ kind: kind, message: String(message), stack: String(stack || '') });
        }
        window.__reporter = {
          held: held,
          replay: function () {
            return held.slice();
          },
        };
        function report(kind, message, stack) {
          hold(kind, message, stack);
          if (sent >= 10) return; // a page stuck in an error loop stops at ten
          if (extensionOnly(stack)) return;
          sent += 1;
          try {
            send(
              JSON.stringify({
                site: site,
                kind: kind,
                message: String(message || 'Unknown error').slice(0, 1500),
                stack: String(stack || '').slice(0, 4000),
                url: location.href,
                userAgent: navigator.userAgent,
              }),
            );
          } catch (ignored) {}
        }
        function flatten(args, from) {
          var parts = [];
          for (var i = from; i < args.length; i += 1) {
            var piece = args[i];
            if (piece && piece.stack) {
              parts.push(piece.stack);
            } else if (typeof piece === 'object') {
              try {
                parts.push(JSON.stringify(piece));
              } catch (ignored) {
                parts.push(String(piece));
              }
            } else {
              parts.push(String(piece));
            }
          }
          return parts.join(' ');
        }
        // Capture phase, because element load failures fire error events that do not bubble.
        window.addEventListener(
          'error',
          function (event) {
            try {
              if (event.target && event.target !== window && event.target.tagName) {
                // A preload is a hint the browser is allowed to drop. Googlebot's
                // renderer cancels the ones it does not need in time, and dropping
                // one fires the same error event a failed fetch does. Nothing the
                // visitor sees is missing: the stylesheet still asks for the font
                // through @font-face, and an element whose own fetch fails fires
                // its own error event. Reporting a hint the browser chose not to
                // use files a ticket for behaviour that is by design.
                var rel = (event.target.rel || '').toLowerCase();
                if (
                  event.target.tagName.toLowerCase() === 'link' &&
                  (rel === 'preload' || rel === 'modulepreload' || rel === 'prefetch')
                ) {
                  return;
                }
                report(
                  'resource',
                  'Failed to load ' +
                    event.target.tagName.toLowerCase() +
                    ': ' +
                    (event.target.src || event.target.href || ''),
                );
              } else {
                report('uncaught', event.message, event.error && event.error.stack);
              }
            } finally {
              if (!loud) event.preventDefault();
            }
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          try {
            var reason = event.reason;
            report(
              'rejection',
              reason && reason.message ? reason.message : reason,
              reason && reason.stack,
            );
          } finally {
            if (!loud) event.preventDefault();
          }
        });
        // A library writing to these is addressing whoever maintains the site rather
        // than whoever is reading the page, so the message travels to the Pi instead
        // of to the visitor's console.
        ['error', 'warn', 'trace'].forEach(function (level) {
          var original = console[level];
          console[level] = function () {
            report('console', flatten(arguments, 0));
            if (loud) original.apply(console, arguments);
          };
        });
        var originalAssert = console.assert;
        console.assert = function (condition) {
          if (condition) return;
          report('console', 'Assertion failed: ' + flatten(arguments, 1));
          if (loud) originalAssert.apply(console, arguments);
        };
        if (window.fetch) {
          var originalFetch = window.fetch;
          window.fetch = function (input) {
            var target = typeof input === 'string' ? input : (input && input.url) || '';
            // Reports about the reporter's own request would loop, so the endpoint passes through unwrapped.
            if (target.indexOf(endpoint) === 0) return originalFetch.apply(window, arguments);
            return originalFetch.apply(window, arguments).then(
              function (response) {
                if (response.status >= 500)
                  report('http', 'HTTP ' + response.status + ' from ' + target.split('?')[0]);
                return response;
              },
              function (error) {
                report(
                  'network',
                  (error && error.message ? error.message : String(error)) +
                    ' fetching ' +
                    target.split('?')[0],
                );
                throw error;
              },
            );
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
